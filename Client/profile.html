<!DOCTYPE = html>
<html lang="en">
    <meta name="viewport" content="width=device-width, initial-scale:1.0'">
    <head>
        <script>
            //Add their profile data to the screen
            function makeProfile(){
                //Get session data and place it on the screen
                var userData = JSON.parse(sessionStorage.getItem("userData"));
                var highScore = JSON.parse(sessionStorage.getItem("highScore"));
                var scores = JSON.parse(sessionStorage.getItem("scores"));
                document.getElementById("username").innerText = "Username: "+userData[0];
                document.getElementById("email").innerText = "Email: "+userData[1];
                document.getElementById("highScore").innerText = "High Score: "+highScore;
                document.getElementById("scores").innerText = "Your Scores: "+scores;
            }
            //Return back to the home screen. The user can also be logging out.
            function returnHome(loggingOut){
                if(loggingOut){ //If the user is logging out
                    //Remove user's data from the session
                    sessionStorage.removeItem("userId");
                    sessionStorage.removeItem("userData");
                    sessionStorage.removeItem("highScore");
                    sessionStorage.removeItem("scores");
                    //Change the learning plan to the default one
                    sessionStorage.setItem("pin",JSON.stringify(null));
                    sessionStorage.setItem("learningPlan",JSON.stringify({
                        maxVishingCall: 26,
                        maxVishingVoiceMail: 4,
                        maxSmishing: 50,
                        maxPhishing: 40,
                        maxPermissions: 52,
                        firewallNinja: true,
                        maxJuice: 1
                    }))
                    //Mark the user as logged out
                    sessionStorage.setItem("loggedIn",JSON.stringify(false)); 
                }
                window.location.href = "home.html";
            }
            //View, create, or join a learning plan
            function learningPlan(option){
                var pin = JSON.parse(sessionStorage.getItem("pin"))
                switch(option){
                    case 0: //User looks at their learning plan
                        //If the user is not enrolled in a learning plan, don't take them to a learning plan
                        if(pin == null){
                            alert("You are not enrolled in a learning plan.");
                            return;
                        }
                        window.location.href = "plan.html";
                        break;
                    case 1: //User creates a learning plan
                        //If the user is enrolled in a learning plan already, don't let them create a new one
                        if(pin != null){
                            alert("You can not create a learning plan while being enrolled in one.");
                            return;
                        }
                        window.location.href = "plan.html";
                        break;
                    case 2: //User wants to choose a learning plan
                        if(pin != null){
                            alert("You can not choose a learning plan while being enrolled in one.");
                            return;
                        }
                        window.location.href = "choose.html";
                        break;
                    default:
                        console.log("Error, invalid learning plan "+option);
                }
            }
        </script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../styles.css">
    </head>
    <body>
        <div class="profileMenu">
            <h1>Your Profile</h1>
            <!--Only a form for the aesthetic of form style. No inputs here.-->
            <div class="form">
                <p id="username"></p>
                <p id="email"></p>
                <p id="highScore"></p>
                <p id="scores"></p>
                <button class="function" onclick="learningPlan(0)">My Learning Plan</button>
                <button class="function" onclick="learningPlan(1)">Create Learning Plan</button>
                <button class="function" onclick="learningPlan(2)">Choose Learning Plan</button><br>

                <button class="function" onclick="window.location.href = 'edit.html'">Edit Profile</button>
                <button class="function" onclick="returnHome(true)">Logout</button><br>
                <button class="function" onclick="returnHome(false)">Return Home</button>
            </div>
        </div>
        <script>makeProfile()</script>
    </body>
</html>
